        <section class="topic-section">

    <script>
  
        fetch("../python_tasks/1.py")
            .then(response => response.text())
            .then(code => {
                const codeElement = document.getElementById("task-1-code");

                codeElement.textContent = code;

                hljs.highlightElement(codeElement);

            .catch(error => {
                document.getElementById("task-1-code").textContent =
                    "Nepodarilo sa načítať úlohu.";

                console.error(error);
            });

    </script>
